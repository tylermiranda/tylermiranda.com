<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyler Miranda</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="style.css" rel="stylesheet" type="text/css" />
  <script src="script.js"></script>
</head>
<body>
  <div class="terminal">
    <div class="terminal-header">
      <div class="title">PowerShell - Tyler Miranda Resume</div>
      <div class="controls">
        <span class="minimize"></span>
        <span class="maximize"></span>
        <span class="close"></span>
      </div>
    </div>
    <div class="terminal-content">
      <div class="initial-command">PS /Users/Visitor> </div>
      <div class="content" style="display: none">
        <div class="profile-container">
          <img src="attached_assets/image_1746199320665.png" alt="Tyler Miranda" class="profile-image">
          <h1>Tyler Miranda</h1>
        </div>
        <div class="output">
          <!-- Content will be loaded dynamically -->
        </div>
        <div class="command">PS /Users/Visitor> _</div>
      </div>
    </div>
  </div>
</body>
</html>
